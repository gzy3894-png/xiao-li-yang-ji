name: Release APK + Gitee Update

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Set app version env
        run: |
          echo "APP_VERSION_CODE=$(node -p "require('./package.json').appVersionCode")" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          else
            echo "KEYSTORE_BASE64 not set, building unsigned release APK"
          fi

      - name: Build release APK
        working-directory: android
        run: bash gradlew assembleRelease --no-daemon

      - name: Prepare update files
        shell: bash
        env:
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          VERSION_CODE=$(node -p "require('./package.json').appVersionCode")
          VERSION_NAME=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME:-manual}"
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "url": "https://gitee.com/%s/raw/releases/app-release.apk",\n  "sha256": "%s",\n  "size": %s,\n  "publishedAt": "%s",\n  "changelog": "release %s"\n}' "$VERSION_CODE" "$VERSION_NAME" "$GITEE_REPO" "$SHA" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$TAG" > update.json
          {
            echo "SHA256=$SHA"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "TAG=$TAG"
          } >> "$GITHUB_ENV"
          echo "update.json:"
          cat update.json

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiao-li-yang-ji-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Push to Gitee update channel
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -e
          REPO_URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          rm -rf gitee-tmp
          mkdir gitee-tmp
          cd gitee-tmp
          git init -q
          git checkout -q -b releases
          cp ../android/app/build/outputs/apk/release/app-release.apk app-release.apk
          cp ../update.json update.json
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions"
          git add app-release.apk update.json
          git commit -q -m "release ${VERSION_NAME} (${TAG})" || echo "no changes to commit"
          git push -q "$REPO_URL" releases --force
          echo "Gitee update published: https://gitee.com/${GITEE_REPO}/raw/releases/update.json"
